<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SendGuz - Chat Privado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 10px; }
        .chat-tab { cursor: pointer; transition: all 0.2s; }
        .chat-tab:hover { background: #27272a; }
        .active-tab { background: #3f3f46; border-left: 4px solid #4f46e5; }
        .msg-deleted { font-style: italic; color: #a1a1aa; display: flex; align-items: center; gap: 5px; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .recording { animation: pulse-red 1.5s infinite; background-color: #ef4444 !important; color: white !important; }
        
        /* Ajustes para Móvil */
        @media (max-width: 768px) {
            #sidebar { width: 100% !important; display: flex !important; }
            #chat-area { display: none !important; width: 100% !important; }
            .mobile-chat-active #sidebar { display: none !important; }
            .mobile-chat-active #chat-area { display: flex !important; }
        }
    </style>
</head>
<body class="bg-zinc-950 flex items-center justify-center min-h-screen font-sans text-white overflow-hidden">

    <div id="login-screen" class="bg-zinc-900 p-8 rounded-3xl shadow-2xl text-center max-w-sm w-full border border-zinc-800 mx-4">
        <div class="flex items-center justify-center gap-3 mb-2">
            <span class="text-5xl drop-shadow-lg">🐺</span>
            <h1 class="text-4xl font-extrabold tracking-tight text-white">SendGuz</h1>
        </div>
        <p class="text-sm text-zinc-400 mb-8">Comunicación Privada y Segura</p>
        <input id="l-user" type="text" placeholder="Usuario" class="w-full p-3 rounded-xl bg-zinc-800 mb-3 outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
        <input id="l-phone" type="text" placeholder="Teléfono" class="w-full p-3 rounded-xl bg-zinc-800 mb-3 outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
        <input id="l-pass" type="password" placeholder="Contraseña" class="w-full p-3 rounded-xl bg-zinc-800 mb-6 outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
        <div class="flex gap-3">
            <button onclick="login()" class="flex-1 bg-indigo-600 py-3 rounded-xl font-bold shadow-lg">Entrar</button>
            <button onclick="register()" class="flex-1 bg-zinc-700 py-3 rounded-xl font-bold">Registrar</button>
        </div>
        <p id="auth-msg" class="text-sm mt-4 hidden"></p>
    </div>

    <div id="chat-screen" class="hidden w-full h-full md:h-[90vh] md:max-w-6xl bg-zinc-900 md:rounded-3xl overflow-hidden flex border-zinc-800 shadow-2xl">
        
        <div id="sidebar" class="w-full md:w-1/3 bg-zinc-950 border-r border-zinc-800 flex flex-col">
            <div class="p-4 bg-zinc-950 border-b border-zinc-800 flex items-center gap-2">
                <span class="text-2xl">🐺</span>
                <span class="font-extrabold text-xl">SendGuz</span>
            </div>
            <div class="p-4 bg-zinc-900 border-b border-zinc-800 flex items-center justify-between">
                <div class="flex items-center gap-3 cursor-pointer" onclick="document.getElementById('my-pic-upload').click()">
                    <img id="my-pic" src="" class="w-10 h-10 md:w-12 md:h-12 rounded-full object-cover bg-zinc-800">
                    <div>
                        <span class="font-bold block text-sm md:text-base" id="my-profile-name"></span>
                        <span class="text-[10px] md:text-xs text-zinc-400" id="my-profile-phone"></span>
                    </div>
                </div>
                <button onclick="addContact()" class="bg-indigo-600 p-2 rounded-full shadow-lg">➕</button>
                <input type="file" id="my-pic-upload" accept="image/*" class="hidden">
            </div>
            <div id="user-list" class="overflow-y-auto flex-1"></div>
        </div>

        <div id="chat-area" class="flex-1 flex flex-col relative bg-[#0a0a0a]">
            <div id="empty-chat" class="absolute inset-0 flex flex-col items-center justify-center text-zinc-500 z-10 bg-zinc-950">
                <div class="text-7xl mb-6 opacity-50 text-white">🐺</div>
                <h2 class="text-2xl font-bold text-zinc-300">Bienvenido</h2>
            </div>

            <div id="active-chat-header" class="hidden bg-zinc-900/95 backdrop-blur-md p-3 md:p-4 flex justify-between items-center border-b border-zinc-800 z-20">
                <div class="flex items-center gap-3">
                    <button onclick="closeChatMobile()" class="md:hidden text-2xl mr-1">←</button>
                    <img id="active-pic" src="" class="w-10 h-10 rounded-full object-cover">
                    <div>
                        <h3 id="chat-title" class="font-bold text-sm md:text-lg"></h3>
                        <span id="chat-status" class="text-[10px] md:text-xs text-zinc-400"></span>
                    </div>
                </div>
            </div>
            
            <div id="messages" class="flex-1 p-4 md:p-6 overflow-y-auto flex flex-col gap-3 z-0 pb-20"></div>

            <div id="emoji-picker" class="hidden absolute bottom-20 left-4 bg-zinc-800 border border-zinc-700 p-3 rounded-2xl grid grid-cols-6 gap-2 text-2xl z-30 shadow-2xl">
                <span class="cursor-pointer hover:scale-125" onclick="addEmoji('😀')">😀</span>
                <span class="cursor-pointer hover:scale-125" onclick="addEmoji('😂')">😂</span>
                <span class="cursor-pointer hover:scale-125" onclick="addEmoji('🥰')">🥰</span>
                <span class="cursor-pointer hover:scale-125" onclick="addEmoji('😎')">😎</span>
                <span class="cursor-pointer hover:scale-125" onclick="addEmoji('👍')">👍</span>
                <span class="cursor-pointer hover:scale-125" onclick="addEmoji('❤️')">❤️</span>
            </div>

            <form id="form" class="hidden p-2 md:p-3 bg-zinc-900 border-t border-zinc-800 flex items-center gap-2 z-20">
                <button type="button" onclick="toggleEmojis()" class="p-2 text-xl text-zinc-400">😊</button>
                <input type="file" id="image-upload" accept="image/*" class="hidden">
                <button type="button" onclick="document.getElementById('image-upload').click()" class="p-2 text-xl text-zinc-400">📎</button>
                <input id="input" autocomplete="off" placeholder="Mensaje..." class="flex-1 bg-zinc-800 rounded-full px-4 py-2 text-sm text-white outline-none">
                <button type="button" id="mic-btn" onclick="toggleAudio()" class="p-3 bg-zinc-700 rounded-full text-lg">🎤</button>
                <button type="submit" id="send-btn" class="hidden p-3 bg-indigo-600 rounded-full text-lg">🚀</button>
            </form>
        </div>
    </div>

    <audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3" preload="auto"></audio>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myUsername = "", activeChat = "";
        let allMessages = [], contacts = {}, unreadCounts = {}, typingStatus = {}, onlineUsers = [];
        let mediaRecorder, audioChunks = [], isRecording = false;

        function register() {
            const u = document.getElementById('l-user').value.trim();
            const p = document.getElementById('l-phone').value.trim();
            const pw = document.getElementById('l-pass').value.trim();
            if(u && p && pw) socket.emit('register', {username: u, phone: p, password: pw});
        }

        function login() {
            const u = document.getElementById('l-user').value.trim();
            const pw = document.getElementById('l-pass').value.trim();
            if(u && pw) socket.emit('login', {username: u, password: pw});
        }

        socket.on('auth_error', msg => { const a = document.getElementById('auth-msg'); a.textContent = msg; a.className = 'text-red-400 text-sm mt-4 block'; });
        socket.on('register_success', msg => { const a = document.getElementById('auth-msg'); a.textContent = msg; a.className = 'text-green-400 text-sm mt-4 block'; });

        socket.on('login_success', (user) => {
            myUsername = user.username;
            document.getElementById('my-profile-name').textContent = user.username;
            document.getElementById('my-profile-phone').textContent = user.phone;
            document.getElementById('my-pic').src = user.profilePic || "https://api.dicebear.com/7.x/bottts/svg?seed=" + user.username;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            document.getElementById('chat-screen').classList.add('flex');
        });

        socket.on('load_initial_data', (data) => {
            allMessages = data.messages;
            data.contacts.forEach(c => contacts[c.username] = c);
            renderUserList();
        });

        function addContact() {
            const val = prompt("Nombre de usuario o Teléfono:");
            if(val) socket.emit('search_contact', val.trim());
        }
        
        socket.on('contact_found', (user) => {
            contacts[user.username] = user;
            openChat(user.username);
        });

        function getContactPic(username) {
            if(contacts[username] && contacts[username].profilePic) return contacts[username].profilePic;
            return "https://api.dicebear.com/7.x/bottts/svg?seed=" + username;
        }

        function renderUserList() {
            const list = document.getElementById('user-list');
            let html = "";
            Object.keys(contacts).forEach(target => {
                const chatMsgs = allMessages.filter(m => (m.sender === target && m.receiver === myUsername) || (m.sender === myUsername && m.receiver === target));
                const lastMsg = chatMsgs.length > 0 ? chatMsgs[chatMsgs.length - 1] : null;
                let preview = "Toca para chatear";
                if (lastMsg) {
                    if (lastMsg.deleted) preview = "🚫 Eliminado";
                    else if (lastMsg.type === 'image') preview = '📷 Imagen';
                    else if (lastMsg.type === 'audio') preview = '🎤 Nota de voz';
                    else preview = lastMsg.text;
                    if (lastMsg.sender === myUsername) preview = "Tú: " + preview;
                }
                if (typingStatus[target]) preview = "<span class='text-indigo-400 italic'>escribiendo...</span>";
                const unread = unreadCounts[target] || 0;
                const isOnline = onlineUsers.includes(target) ? '<div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-zinc-950"></div>' : '';

                html += "<div onclick=\"openChat('" + target + "')\" class=\"chat-tab p-4 border-b border-zinc-800/50 flex items-center justify-between " + (activeChat === target ? 'active-tab' : '') + "\">" +
                            "<div class=\"flex items-center gap-3 overflow-hidden w-3/4\">" +
                                "<div class=\"relative flex-shrink-0\"><img src=\"" + getContactPic(target) + "\" class=\"w-12 h-12 rounded-full object-cover bg-zinc-800\" />" + isOnline + "</div>" +
                                "<div class=\"truncate w-full\"><span class=\"font-bold text-zinc-100 block\">" + target + "</span><span class=\"text-xs text-zinc-400 block truncate\">" + preview + "</span></div>" +
                            "</div>" +
                            (unread > 0 ? "<div class=\"bg-indigo-500 text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full\">" + unread + "</div>" : "") +
                        "</div>";
            });
            list.innerHTML = html;
        }

        // --- MANEJO DE VISTAS MÓVILES ---
        function openChat(targetUser) {
            activeChat = targetUser;
            unreadCounts[targetUser] = 0; 
            document.body.classList.add('mobile-chat-active'); // Activar vista de chat en móvil
            document.getElementById('empty-chat').classList.add('hidden');
            document.getElementById('active-chat-header').classList.remove('hidden');
            document.getElementById('form').classList.remove('hidden');
            document.getElementById('chat-title').textContent = targetUser;
            document.getElementById('active-pic').src = getContactPic(targetUser);
            socket.emit('mark_read', targetUser); 
            renderMessages();
            renderUserList(); 
        }

        function closeChatMobile() {
            activeChat = "";
            document.body.classList.remove('mobile-chat-active'); // Volver a la lista en móvil
        }

        function renderMessages() {
            if(!activeChat) return;
            const box = document.getElementById('messages');
            box.innerHTML = '';
            const chatMsgs = allMessages.filter(m => (m.sender === activeChat && m.receiver === myUsername) || (m.sender === myUsername && m.receiver === activeChat));
            chatMsgs.forEach(msg => {
                const isMe = msg.sender === myUsername;
                const div = document.createElement('div');
                div.className = "flex flex-col " + (isMe ? "items-end" : "items-start");
                let contentHTML = msg.deleted ? "<span class='msg-deleted'>🚫 Eliminado</span>" : (msg.type === 'image' ? "<img src='" + msg.text + "' class='rounded-xl max-w-[200px]'>" : (msg.type === 'audio' ? "<audio controls src='" + msg.text + "' class='h-8 w-48'></audio>" : "<p class='text-sm'>" + msg.text + "</p>"));
                let ticks = isMe && !msg.deleted ? (msg.status === 'read' ? "<span class='text-blue-400 font-bold text-[10px]'>✓✓</span>" : "<span class='text-zinc-400 font-bold text-[10px]'>✓✓</span>") : "";
                
                div.innerHTML = "<div class='group relative max-w-[80%]'><div class='p-3 rounded-2xl " + (isMe ? "bg-indigo-600 rounded-tr-none" : "bg-zinc-800 rounded-tl-none") + "'>" + contentHTML + "<div class='flex justify-end gap-1 mt-1'><span class='text-[9px] opacity-70'>" + msg.time + "</span>" + ticks + "</div></div>" + (isMe && !msg.deleted ? "<button onclick=\"deleteMessage('" + msg._id + "')\" class='text-[10px] text-red-400 mt-1 opacity-0 group-hover:opacity-100'>Borrar</button>" : "") + "</div>";
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        }

        socket.on('chat message', (msg) => {
            allMessages.push(msg);
            if (msg.sender !== myUsername) {
                if (activeChat !== msg.sender) { unreadCounts[msg.sender] = (unreadCounts[msg.sender] || 0) + 1; document.getElementById('notif-sound').play().catch(()=>{}); }
                else socket.emit('mark_read', msg.sender); 
            }
            renderMessages(); renderUserList(); 
        });

        socket.on('online_status', users => { onlineUsers = users; renderUserList(); });
        socket.on('messages_read', reader => { allMessages.forEach(m => { if (m.sender === myUsername && m.receiver === reader) m.status = 'read'; }); renderMessages(); });
        socket.on('message_deleted', id => { const m = allMessages.find(x => x._id === id); if(m){ m.deleted = true; renderMessages(); renderUserList(); } });

        const input = document.getElementById('input');
        input.addEventListener('input', () => {
            const hasText = input.value.trim().length > 0;
            document.getElementById('send-btn').classList.toggle('hidden', !hasText);
            document.getElementById('mic-btn').classList.toggle('hidden', hasText);
            socket.emit('typing', { isTyping: hasText, receiver: activeChat });
        });

        document.getElementById('form').addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value.trim()) {
                socket.emit('chat message', { text: input.value, type: 'text', receiver: activeChat });
                input.value = ''; socket.emit('typing', { isTyping: false, receiver: activeChat });
                document.getElementById('send-btn').classList.add('hidden');
                document.getElementById('mic-btn').classList.remove('hidden');
            }
        });

        async function toggleAudio() {
            if (!isRecording) {
                try {
                    const s = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(s);
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const r = new FileReader(); r.readAsDataURL(new Blob(audioChunks, {type:'audio/webm'}));
                        r.onloadend = () => socket.emit('chat message', { text: r.result, type: 'audio', receiver: activeChat });
                        audioChunks = [];
                    };
                    mediaRecorder.start(); isRecording = true; document.getElementById('mic-btn').classList.add('recording');
                } catch(e) { alert("Permite el micrófono"); }
            } else { mediaRecorder.stop(); isRecording = false; document.getElementById('mic-btn').classList.remove('recording'); }
        }

        function deleteMessage(id) { if(confirm("¿Borrar?")) socket.emit('delete_message', id); }
        function toggleEmojis() { document.getElementById('emoji-picker').classList.toggle('hidden'); }
        function addEmoji(e) { input.value += e; toggleEmojis(); input.dispatchEvent(new Event('input')); }
        socket.on('typing', d => { typingStatus[d.user] = d.isTyping; renderUserList(); });
    </script>
</body>
</html>
