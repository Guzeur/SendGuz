<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SendGuz - Chat Privado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 10px; }
        .chat-tab { cursor: pointer; transition: all 0.2s; -webkit-tap-highlight-color: transparent; }
        .chat-tab:hover { background: #27272a; }
        .active-tab { background: #3f3f46; border-left: 4px solid #4f46e5; }
        .msg-deleted { font-style: italic; color: #a1a1aa; display: flex; align-items: center; gap: 5px; }
        
        /* Ajustes de pulsación larga y estética móvil */
        .msg-bubble { 
            user-select: none; 
            -webkit-user-select: none; 
            -webkit-touch-callout: none; 
            transition: transform 0.1s; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        .msg-bubble:active { transform: scale(0.97); }
        
        /* Fondo clásico de chat tipo WhatsApp */
        .chat-bg {
            background-color: #0b141a;
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-blend-mode: multiply;
            background-size: contain;
        }

        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .recording { animation: pulse-red 1.5s infinite; background-color: #ef4444 !important; color: white !important; }
        
        @media (max-width: 768px) {
            #sidebar { width: 100% !important; display: flex !important; height: 100vh !important; }
            #chat-area { display: none !important; width: 100% !important; height: 100vh !important; }
            .mobile-chat-active #sidebar { display: none !important; }
            .mobile-chat-active #chat-area { display: flex !important; }
        }
    </style>
</head>
<body class="bg-zinc-950 flex items-center justify-center min-h-screen font-sans text-white overflow-hidden">

    <div id="login-screen" class="bg-zinc-900 p-8 rounded-3xl shadow-2xl text-center max-w-sm w-full border border-zinc-800 mx-4 z-50">
        <div class="flex items-center justify-center gap-3 mb-2">
            <span class="text-5xl drop-shadow-lg">🐺</span>
            <h1 class="text-4xl font-extrabold tracking-tight text-white">SendGuz</h1>
        </div>
        <p class="text-sm text-zinc-400 mb-8">Comunicación Privada y Segura</p>
        <input id="l-user" type="text" placeholder="Usuario" class="w-full p-3 rounded-xl bg-zinc-800 mb-3 outline-none focus:ring-2 focus:ring-indigo-500">
        <input id="l-phone" type="text" placeholder="Teléfono" class="w-full p-3 rounded-xl bg-zinc-800 mb-3 outline-none focus:ring-2 focus:ring-indigo-500">
        <input id="l-pass" type="password" placeholder="Contraseña" class="w-full p-3 rounded-xl bg-zinc-800 mb-6 outline-none focus:ring-2 focus:ring-indigo-500">
        <div class="flex gap-3">
            <button onclick="login()" class="flex-1 bg-indigo-600 py-3 rounded-xl font-bold shadow-lg">Entrar</button>
            <button onclick="register()" class="flex-1 bg-zinc-700 py-3 rounded-xl font-bold">Registrar</button>
        </div>
        <p id="auth-msg" class="text-sm mt-4 hidden"></p>
    </div>

    <div id="chat-screen" class="hidden w-full h-screen md:h-[95vh] md:max-w-6xl bg-zinc-900 md:rounded-3xl overflow-hidden flex border-zinc-800 shadow-2xl">
        
        <div id="sidebar" class="w-full md:w-1/3 bg-zinc-950 border-r border-zinc-800 flex flex-col h-full">
            <div class="p-4 bg-zinc-950 flex items-center justify-between border-b border-zinc-900">
                <div class="flex items-center gap-2">
                    <span class="text-2xl">🐺</span>
                    <span class="font-extrabold text-xl tracking-tight text-white">SendGuz</span>
                </div>
                <button onclick="addContact()" class="bg-indigo-600/20 text-indigo-400 p-2 rounded-lg hover:bg-indigo-600 hover:text-white transition-all text-sm font-bold">
                    ➕ <span class="hidden md:inline ml-1">Nuevo</span>
                </button>
            </div>

            <div class="px-4 py-3 bg-zinc-900 border-b border-zinc-800 flex items-center gap-3 cursor-pointer hover:bg-zinc-800 transition-colors" onclick="document.getElementById('my-pic-upload').click()">
                <div id="my-pic-container" class="w-10 h-10 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center overflow-hidden">
                    <img id="my-pic" src="" class="hidden w-full h-full object-cover">
                    <span id="my-pic-placeholder" class="text-zinc-500 text-xl">👤</span>
                </div>
                <div class="flex-1 overflow-hidden">
                    <span class="font-bold block text-sm truncate" id="my-profile-name"></span>
                    <span class="text-[10px] text-zinc-400">Mi Perfil (Toca para cambiar foto)</span>
                </div>
                <input type="file" id="my-pic-upload" accept="image/*" class="hidden">
            </div>

            <div class="px-4 py-3 bg-zinc-950"><h2 class="text-2xl font-black text-white/90">Chats</h2></div>
            <div id="user-list" class="flex-1 overflow-y-auto overflow-x-hidden bg-zinc-950"></div>
        </div>

        <div id="chat-area" class="flex-1 flex flex-col relative chat-bg h-full">
            
            <div id="empty-chat" class="absolute inset-0 flex flex-col items-center justify-center text-zinc-500 z-10 bg-zinc-950">
                <div class="text-7xl mb-6 opacity-30 text-white">🐺</div>
                <h2 class="text-xl font-bold text-zinc-400">SendGuz Privado</h2>
            </div>

            <div id="active-chat-header" class="hidden bg-zinc-900/95 backdrop-blur-md p-3 flex justify-between items-center border-b border-zinc-800 z-20 flex-shrink-0 cursor-pointer hover:bg-zinc-800 transition" onclick="renameContact()" title="Toca para cambiar nombre">
                <div class="flex items-center gap-3">
                    <button onclick="closeChatMobile(); event.stopPropagation();" class="md:hidden text-2xl p-1">←</button>
                    <div id="active-pic-container" class="w-10 h-10 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center overflow-hidden">
                        <img id="active-pic" src="" class="hidden w-full h-full object-cover">
                        <span id="active-pic-placeholder" class="text-zinc-500 text-xl">👤</span>
                    </div>
                    <div>
                        <h3 id="chat-title" class="font-bold text-sm md:text-base truncate"></h3>
                        <span id="chat-status" class="text-[10px] md:text-xs text-green-400 block"></span>
                    </div>
                </div>
            </div>
            
            <div id="messages" class="flex-1 p-4 md:px-8 overflow-y-auto flex flex-col gap-2 z-0 overflow-x-hidden"></div>

            <div id="emoji-picker" class="hidden absolute bottom-[80px] left-2 bg-zinc-800 border border-zinc-700 p-4 rounded-2xl grid grid-cols-6 gap-3 text-2xl z-50 shadow-2xl">
                <span class="cursor-pointer hover:scale-110" onclick="addEmoji('😀')">😀</span>
                <span class="cursor-pointer hover:scale-110" onclick="addEmoji('😂')">😂</span>
                <span class="cursor-pointer hover:scale-110" onclick="addEmoji('🥰')">🥰</span>
                <span class="cursor-pointer hover:scale-110" onclick="addEmoji('😎')">😎</span>
                <span class="cursor-pointer hover:scale-110" onclick="addEmoji('🥺')">🥺</span>
                <span class="cursor-pointer hover:scale-110" onclick="addEmoji('😭')">😭</span>
                <span class="cursor-pointer hover:scale-110" onclick="addEmoji('👍')">👍</span>
                <span class="cursor-pointer hover:scale-110" onclick="addEmoji('🙏')">🙏</span>
                <span class="cursor-pointer hover:scale-110" onclick="addEmoji('❤️')">❤️</span>
                <span class="cursor-pointer hover:scale-110" onclick="addEmoji('🔥')">🔥</span>
                <span class="cursor-pointer hover:scale-110" onclick="addEmoji('🎉')">🎉</span>
                <span class="cursor-pointer hover:scale-110" onclick="addEmoji('🐺')">🐺</span>
            </div>

            <div class="p-2 md:p-4 bg-transparent z-20 flex-shrink-0 pb-4">
                <form id="form" class="hidden bg-zinc-900 border border-zinc-800 rounded-full flex items-center gap-1 p-1 md:p-2 shadow-lg">
                    <button type="button" onclick="toggleEmojis()" class="p-2 text-2xl text-zinc-400 hover:text-white">😊</button>
                    <input type="file" id="image-upload" accept="image/*" class="hidden">
                    <button type="button" onclick="document.getElementById('image-upload').click()" class="p-2 text-xl text-zinc-400 hover:text-white">📎</button>
                    <input id="input" autocomplete="off" placeholder="Escribe un mensaje..." class="flex-1 bg-transparent px-2 py-2 text-sm text-white outline-none">
                    <button type="button" id="mic-btn" onclick="toggleAudio()" class="w-10 h-10 flex items-center justify-center bg-indigo-600 rounded-full text-lg shadow-md hover:scale-105 transition-transform">🎤</button>
                    <button type="submit" id="send-btn" class="hidden w-10 h-10 flex items-center justify-center bg-green-500 rounded-full text-lg shadow-md hover:scale-105 transition-transform">🚀</button>
                </form>
            </div>
        </div>
    </div>

    <audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3" preload="auto"></audio>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myUsername = "", activeChat = "";
        let allMessages = [], contacts = {}, unreadCounts = {}, typingStatus = {}, onlineUsers = [];
        let mediaRecorder, audioChunks = [], isRecording = false;

        // Memoria para guardar apodos locales
        let aliases = JSON.parse(localStorage.getItem('sg_aliases')) || {};

        function getDisplayName(username) {
            return aliases[username] || username;
        }

        function renameContact() {
            if(!activeChat) return;
            const currentName = getDisplayName(activeChat);
            const newAlias = prompt("Guardar contacto como:", currentName);
            if(newAlias !== null && newAlias.trim() !== "") {
                aliases[activeChat] = newAlias.trim();
                localStorage.setItem('sg_aliases', JSON.stringify(aliases));
                document.getElementById('chat-title').textContent = aliases[activeChat];
                renderUserList();
            }
        }

        function login() {
            const u = document.getElementById('l-user').value.trim();
            const pw = document.getElementById('l-pass').value.trim();
            if(u && pw) socket.emit('login', {username: u, password: pw});
        }

        function register() {
            const u = document.getElementById('l-user').value.trim();
            const p = document.getElementById('l-phone').value.trim();
            const pw = document.getElementById('l-pass').value.trim();
            if(u && p && pw) socket.emit('register', {username: u, phone: p, password: pw});
        }

        socket.on('auth_error', msg => { const a = document.getElementById('auth-msg'); a.textContent = msg; a.className = 'text-red-400 text-sm mt-4 block'; a.classList.remove('hidden'); });
        socket.on('register_success', msg => { const a = document.getElementById('auth-msg'); a.textContent = msg; a.className = 'text-green-400 text-sm mt-4 block'; a.classList.remove('hidden'); });

        socket.on('login_success', (user) => {
            myUsername = user.username;
            document.getElementById('my-profile-name').textContent = user.username;
            updateAvatarDisplay('my-pic', 'my-pic-placeholder', user.profilePic);
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            document.getElementById('chat-screen').classList.add('flex');
        });

        socket.on('load_initial_data', (data) => {
            allMessages = data.messages;
            data.contacts.forEach(c => contacts[c.username] = c);
            renderUserList();
        });

        function updateAvatarDisplay(imgId, placeholderId, picData) {
            const img = document.getElementById(imgId);
            const ph = document.getElementById(placeholderId);
            if(picData && picData !== "") {
                img.src = picData; img.classList.remove('hidden'); ph.classList.add('hidden');
            } else {
                img.classList.add('hidden'); ph.classList.remove('hidden');
            }
        }

        function addContact() {
            const val = prompt("Nombre de usuario o Teléfono:");
            if(val) socket.emit('search_contact', val.trim());
        }
        
        socket.on('contact_found', (user) => {
            contacts[user.username] = user;
            openChat(user.username);
        });

        function renderUserList() {
            const list = document.getElementById('user-list');
            list.innerHTML = "";
            Object.keys(contacts).forEach(target => {
                const chatMsgs = allMessages.filter(m => (m.sender === target && m.receiver === myUsername) || (m.sender === myUsername && m.receiver === target));
                const lastMsg = chatMsgs.length > 0 ? chatMsgs[chatMsgs.length - 1] : null;
                
                let preview = "Toca para chatear";
                if (lastMsg) {
                    if (lastMsg.deleted) preview = "🚫 Eliminado";
                    else if (lastMsg.type === 'image') preview = '📷 Imagen';
                    else if (lastMsg.type === 'audio') preview = '🎤 Nota de voz';
                    else preview = lastMsg.text;
                }
                if (typingStatus[target]) preview = "<span class='text-indigo-400 italic'>escribiendo...</span>";

                const isOnline = onlineUsers.includes(target) ? "<div class='absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-zinc-950'></div>" : "";
                const unread = unreadCounts[target] || 0;
                
                const displayName = getDisplayName(target);
                const pic = contacts[target].profilePic;
                const avatarHtml = pic ? "<img src='" + pic + "' class='w-12 h-12 rounded-full object-cover'>" : "<div class='w-12 h-12 rounded-full bg-zinc-800 flex items-center justify-center text-xl'>👤</div>";

                const div = document.createElement('div');
                div.onclick = () => openChat(target);
                div.className = "chat-tab p-4 border-b border-zinc-900/50 flex items-center justify-between " + (activeChat === target ? "active-tab" : "");
                
                let unreadHtml = unread > 0 ? "<div class='bg-indigo-500 text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full'>" + unread + "</div>" : "";
                
                div.innerHTML = "<div class='flex items-center gap-3 overflow-hidden w-3/4'>" +
                                    "<div class='relative flex-shrink-0'>" + avatarHtml + isOnline + "</div>" +
                                    "<div class='truncate w-full'>" +
                                        "<span class='font-bold text-zinc-100 block'>" + displayName + "</span>" +
                                        "<span class='text-xs text-zinc-400 block truncate'>" + preview + "</span>" +
                                    "</div>" +
                                "</div>" + unreadHtml;
                list.appendChild(div);
            });
        }

        function openChat(targetUser) {
            activeChat = targetUser;
            unreadCounts[targetUser] = 0; 
            document.body.classList.add('mobile-chat-active');
            document.getElementById('empty-chat').classList.add('hidden');
            document.getElementById('active-chat-header').classList.remove('hidden');
            document.getElementById('form').classList.remove('hidden');
            document.getElementById('chat-title').textContent = getDisplayName(targetUser);
            updateAvatarDisplay('active-pic', 'active-pic-placeholder', contacts[targetUser].profilePic);
            socket.emit('mark_read', targetUser); 
            renderMessages();
            renderUserList(); 
        }

        function closeChatMobile() { activeChat = ""; document.body.classList.remove('mobile-chat-active'); }

        function renderMessages() {
            if(!activeChat) return;
            const box = document.getElementById('messages');
            box.innerHTML = '';
            const chatMsgs = allMessages.filter(m => (m.sender === activeChat && m.receiver === myUsername) || (m.sender === myUsername && m.receiver === activeChat));
            
            chatMsgs.forEach(msg => {
                const isMe = msg.sender === myUsername;
                const div = document.createElement('div');
                div.className = "flex flex-col mb-1 " + (isMe ? "items-end" : "items-start");
                
                let contentHTML = "";
                if (msg.deleted) {
                    contentHTML = "<span class='msg-deleted'>🚫 Eliminado</span>";
                } else if (msg.type === 'image') {
                    contentHTML = "<img src='" + msg.text + "' class='rounded-xl max-w-[200px] sm:max-w-[250px]'>";
                } else if (msg.type === 'audio') {
                    contentHTML = "<audio controls src='" + msg.text + "' class='h-8 w-48 sm:w-60'></audio>";
                } else {
                    contentHTML = "<p class='text-sm leading-relaxed'>" + msg.text + "</p>";
                }

                let ticks = isMe && !msg.deleted ? (msg.status === 'read' ? "<span class='text-blue-400 font-bold text-[11px] ml-1'>✓✓</span>" : "<span class='text-zinc-400 font-bold text-[11px] ml-1'>✓✓</span>") : "";
                
                const bubble = document.createElement('div');
                bubble.className = "msg-bubble max-w-[85%] px-3 py-2 rounded-2xl " + (isMe ? "bg-[#005c4b] text-white rounded-tr-none" : "bg-zinc-800 text-white rounded-tl-none");
                bubble.innerHTML = contentHTML + "<div class='flex justify-end items-center mt-1'><span class='text-[9px] opacity-70'>" + msg.time + "</span>" + ticks + "</div>";
                
                // --- MAGIA: PULSACIÓN LARGA PARA BORRAR ---
                if (isMe && !msg.deleted) {
                    let pressTimer;
                    const startPress = (e) => {
                        pressTimer = setTimeout(() => {
                            if(confirm("¿Eliminar mensaje para todos?")) socket.emit('delete_message', msg._id);
                        }, 600); // 600 milisegundos
                    };
                    const endPress = () => { clearTimeout(pressTimer); };
                    
                    // Eventos táctiles y de ratón
                    bubble.addEventListener('mousedown', startPress);
                    bubble.addEventListener('touchstart', startPress, {passive: true});
                    bubble.addEventListener('mouseup', endPress);
                    bubble.addEventListener('mouseleave', endPress);
                    bubble.addEventListener('touchend', endPress);
                    bubble.addEventListener('touchcancel', endPress);
                    
                    // Bloquear clic derecho para que no estorbe en PC/Móvil
                    bubble.oncontextmenu = (e) => { e.preventDefault(); return false; };
                }

                div.appendChild(bubble);
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        }

        socket.on('chat message', (msg) => {
            allMessages.push(msg);
            if (msg.sender !== myUsername) {
                if (!contacts[msg.sender]) { contacts[msg.sender] = { username: msg.sender, profilePic: "" }; }
                if (activeChat !== msg.sender) { unreadCounts[msg.sender] = (unreadCounts[msg.sender] || 0) + 1; document.getElementById('notif-sound').play().catch(()=>{}); }
                else socket.emit('mark_read', msg.sender);
            }
            renderMessages(); renderUserList(); 
        });

        socket.on('online_status', users => { onlineUsers = users; renderUserList(); });
        socket.on('messages_read', reader => { allMessages.forEach(m => { if (m.sender === myUsername && m.receiver === reader) m.status = 'read'; }); renderMessages(); });
        socket.on('message_deleted', id => { const m = allMessages.find(x => x._id === id); if(m){ m.deleted = true; renderMessages(); renderUserList(); } });

        const input = document.getElementById('input');
        input.addEventListener('input', () => {
            const hasText = input.value.trim().length > 0;
            document.getElementById('send-btn').classList.toggle('hidden', !hasText);
            document.getElementById('mic-btn').classList.toggle('hidden', hasText);
            socket.emit('typing', { isTyping: hasText, receiver: activeChat });
        });

        document.getElementById('form').addEventListener('submit', (e) => {
            e.preventDefault();
            document.getElementById('emoji-picker').classList.add('hidden'); // Ocultar emojis al enviar
            if (input.value.trim()) {
                socket.emit('chat message', { text: input.value, type: 'text', receiver: activeChat });
                input.value = ''; socket.emit('typing', { isTyping: false, receiver: activeChat });
                document.getElementById('send-btn').classList.add('hidden');
                document.getElementById('mic-btn').classList.remove('hidden');
            }
        });

        async function toggleAudio() {
            if (!isRecording) {
                try {
                    const s = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(s);
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const r = new FileReader(); r.readAsDataURL(new Blob(audioChunks, {type:'audio/webm'}));
                        r.onloadend = () => socket.emit('chat message', { text: r.result, type: 'audio', receiver: activeChat });
                        audioChunks = [];
                    };
                    mediaRecorder.start(); isRecording = true; document.getElementById('mic-btn').classList.add('recording');
                } catch(e) { alert("Permite el micrófono"); }
            } else { mediaRecorder.stop(); isRecording = false; document.getElementById('mic-btn').classList.remove('recording'); }
        }

        document.getElementById('my-pic-upload').addEventListener('change', function() {
            const file = this.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = e => socket.emit('update_profile_pic', e.target.result);
                reader.readAsDataURL(file);
            }
        });
        socket.on('profile_pic_updated', base64 => updateAvatarDisplay('my-pic', 'my-pic-placeholder', base64));
        socket.on('contact_pic_updated', data => { if(contacts[data.username]) contacts[data.username].profilePic = data.profilePic; renderUserList(); });

        function toggleEmojis() { document.getElementById('emoji-picker').classList.toggle('hidden'); }
        function addEmoji(e) { input.value += e; input.dispatchEvent(new Event('input')); }
        socket.on('typing', d => { typingStatus[d.user] = d.isTyping; if(activeChat === d.user) document.getElementById('chat-status').textContent = d.isTyping ? 'escribiendo...' : 'en línea'; renderUserList(); });
    </script>
</body>
</html>
