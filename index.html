<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat V5 - Privado & Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 10px; }
        .chat-tab { cursor: pointer; transition: all 0.2s; }
        .chat-tab:hover { background: #27272a; }
        .active-tab { background: #3f3f46; border-left: 4px solid #4f46e5; }
        .msg-deleted { font-style: italic; color: #a1a1aa; display: flex; align-items: center; gap: 5px; }
        /* Animación para el botón de grabar */
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .recording { animation: pulse-red 1.5s infinite; background-color: #ef4444 !important; color: white !important; }
    </style>
</head>
<body class="bg-zinc-950 flex items-center justify-center min-h-screen p-4 font-sans text-white">

    <div id="login-screen" class="bg-zinc-900 p-8 rounded-3xl shadow-2xl text-center max-w-sm w-full border border-zinc-800">
        <div class="text-5xl mb-4">🔐</div>
        <h1 class="text-2xl font-extrabold mb-2">WhatsApp Pro</h1>
        <p class="text-sm text-zinc-400 mb-6">Solo Chats Privados</p>
        
        <input id="l-user" type="text" placeholder="Usuario" class="w-full p-3 rounded-xl bg-zinc-800 mb-3 outline-none">
        <input id="l-phone" type="text" placeholder="Teléfono (Solo Registro)" class="w-full p-3 rounded-xl bg-zinc-800 mb-3 outline-none">
        <input id="l-pass" type="password" placeholder="Contraseña" class="w-full p-3 rounded-xl bg-zinc-800 mb-4 outline-none">
        
        <div class="flex gap-2">
            <button onclick="login()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-bold">Entrar</button>
            <button onclick="register()" class="flex-1 bg-zinc-700 hover:bg-zinc-600 py-3 rounded-xl font-bold">Registrar</button>
        </div>
        <p id="auth-msg" class="text-sm mt-4 hidden"></p>
    </div>

    <div id="chat-screen" class="hidden w-full max-w-6xl bg-zinc-900 rounded-3xl overflow-hidden flex h-[85vh] border border-zinc-800">
        
        <div class="w-1/3 bg-zinc-950 border-r border-zinc-800 flex flex-col">
            <div class="p-4 bg-zinc-900 border-b border-zinc-800 flex items-center justify-between">
                <div class="flex items-center gap-3 cursor-pointer" onclick="document.getElementById('my-pic-upload').click()">
                    <img id="my-pic" src="" class="w-12 h-12 rounded-full object-cover bg-zinc-800 hover:opacity-75 transition-opacity" title="Cambiar Foto">
                    <div>
                        <span class="font-bold block" id="my-profile-name"></span>
                        <span class="text-xs text-zinc-400" id="my-profile-phone"></span>
                    </div>
                </div>
                <button onclick="addContact()" class="bg-indigo-600 p-2 rounded-full hover:bg-indigo-500" title="Nuevo Chat">➕</button>
                <input type="file" id="my-pic-upload" accept="image/*" class="hidden">
            </div>
            
            <div id="user-list" class="overflow-y-auto flex-1">
                </div>
        </div>

        <div class="flex-1 flex flex-col relative bg-[#0a0a0a]">
            <div id="empty-chat" class="absolute inset-0 flex flex-col items-center justify-center text-zinc-500 z-10 bg-zinc-950">
                <div class="text-6xl mb-4">📱</div>
                <h2 class="text-xl font-bold">Selecciona un chat para empezar</h2>
            </div>

            <div id="active-chat-header" class="hidden bg-zinc-900/90 backdrop-blur-md p-4 flex justify-between items-center border-b border-zinc-800 z-20">
                <div class="flex items-center gap-3">
                    <img id="active-pic" src="" class="w-10 h-10 rounded-full object-cover">
                    <div>
                        <h3 id="chat-title" class="font-bold"></h3>
                        <span id="chat-status" class="text-xs text-zinc-400"></span>
                    </div>
                </div>
            </div>
            
            <div id="messages" class="flex-1 p-6 overflow-y-auto flex flex-col gap-3 z-0 pb-20"></div>

            <div id="emoji-picker" class="hidden absolute bottom-20 left-4 bg-zinc-800 border border-zinc-700 p-3 rounded-2xl grid grid-cols-6 gap-2 text-2xl z-30 shadow-2xl">
                <span class="cursor-pointer hover:scale-125 transition" onclick="addEmoji('😀')">😀</span>
                <span class="cursor-pointer hover:scale-125 transition" onclick="addEmoji('😂')">😂</span>
                <span class="cursor-pointer hover:scale-125 transition" onclick="addEmoji('🥰')">🥰</span>
                <span class="cursor-pointer hover:scale-125 transition" onclick="addEmoji('😎')">😎</span>
                <span class="cursor-pointer hover:scale-125 transition" onclick="addEmoji('🤔')">🤔</span>
                <span class="cursor-pointer hover:scale-125 transition" onclick="addEmoji('😭')">😭</span>
                <span class="cursor-pointer hover:scale-125 transition" onclick="addEmoji('👍')">👍</span>
                <span class="cursor-pointer hover:scale-125 transition" onclick="addEmoji('❤️')">❤️</span>
                <span class="cursor-pointer hover:scale-125 transition" onclick="addEmoji('🔥')">🔥</span>
                <span class="cursor-pointer hover:scale-125 transition" onclick="addEmoji('🎉')">🎉</span>
                <span class="cursor-pointer hover:scale-125 transition" onclick="addEmoji('👀')">👀</span>
                <span class="cursor-pointer hover:scale-125 transition" onclick="addEmoji('🙏')">🙏</span>
            </div>

            <form id="form" class="hidden p-3 bg-zinc-900 border-t border-zinc-800 flex items-center gap-2 z-20">
                <button type="button" onclick="toggleEmojis()" class="p-3 text-xl text-zinc-400 hover:text-white">😊</button>
                <input type="file" id="image-upload" accept="image/*" class="hidden">
                <button type="button" onclick="document.getElementById('image-upload').click()" class="p-3 text-xl text-zinc-400 hover:text-white">📎</button>
                
                <input id="input" autocomplete="off" placeholder="Mensaje..." class="flex-1 bg-zinc-800 rounded-full px-5 py-3 text-white outline-none focus:ring-1 focus:ring-indigo-500">
                
                <button type="button" id="mic-btn" onclick="toggleAudio()" class="p-3 bg-zinc-700 rounded-full text-xl hover:bg-zinc-600 transition-colors">🎤</button>
                <button type="submit" id="send-btn" class="hidden p-3 bg-indigo-600 rounded-full text-xl hover:bg-indigo-500 transition-colors">🚀</button>
            </form>
        </div>
    </div>

    <audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3" preload="auto"></audio>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myUsername = "", activeChat = "";
        let allMessages = [], contacts = {}, unreadCounts = {}, typingStatus = {}, onlineUsers = [];
        let mediaRecorder, audioChunks = [], isRecording = false;

        const authMsg = document.getElementById('auth-msg');

        // --- AUTH ---
        function register() {
            const u = document.getElementById('l-user').value.trim();
            const p = document.getElementById('l-phone').value.trim();
            const pw = document.getElementById('l-pass').value.trim();
            if(u && p && pw) socket.emit('register', {username: u, phone: p, password: pw});
            else alert("Llena Usuario, Teléfono y Contraseña para registrarte.");
        }

        function login() {
            const u = document.getElementById('l-user').value.trim();
            const pw = document.getElementById('l-pass').value.trim();
            if(u && pw) socket.emit('login', {username: u, password: pw});
        }

        socket.on('auth_error', msg => { authMsg.textContent = msg; authMsg.className = 'text-red-400 text-sm mt-4 block'; });
        socket.on('register_success', msg => { authMsg.textContent = msg; authMsg.className = 'text-green-400 text-sm mt-4 block'; });

        socket.on('login_success', (user) => {
            myUsername = user.username;
            document.getElementById('my-profile-name').textContent = user.username;
            document.getElementById('my-profile-phone').textContent = user.phone;
            document.getElementById('my-pic').src = user.profilePic || https://api.dicebear.com/7.x/bottts/svg?seed=${user.username};
            
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            document.getElementById('chat-screen').classList.add('flex');
        });

        // --- CARGA INICIAL ---
        socket.on('load_initial_data', (data) => {
            allMessages = data.messages;
            data.contacts.forEach(c => contacts[c.username] = c);
            renderUserList();
        });

        // --- AGREGAR CONTACTO ---
        function addContact() {
            const val = prompt("Ingresa el Nombre de Usuario o Teléfono de la persona:");
            if(val) socket.emit('search_contact', val.trim());
        }
        
        socket.on('contact_found', (user) => {
            contacts[user.username] = user;
            openChat(user.username);
            renderUserList();
        });
        socket.on('search_error', (msg) => alert(msg));

        // --- FOTO DE PERFIL ---
        document.getElementById('my-pic-upload').addEventListener('change', function() {
            const file = this.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = e => socket.emit('update_profile_pic', e.target.result);
                reader.readAsDataURL(file);
            }
        });
        socket.on('profile_pic_updated', base64 => document.getElementById('my-pic').src = base64);
        socket.on('contact_pic_updated', data => {
            if(contacts[data.username]) contacts[data.username].profilePic = data.profilePic;
            if(activeChat === data.username) document.getElementById('active-pic').src = data.profilePic;
            renderUserList();
        });

        // --- LISTA DE CONTACTOS LATERAL ---
        socket.on('online_status', users => { onlineUsers = users; renderUserList(); });

        function getContactPic(username) {
            if(contacts[username] && contacts[username].profilePic) return contacts[username].profilePic;
            return https://api.dicebear.com/7.x/bottts/svg?seed=${username};
        }

        function renderUserList() {
            const list = document.getElementById('user-list');
            let html = "";
            
            Object.keys(contacts).forEach(target => {
                const chatMsgs = allMessages.filter(m => (m.sender === target && m.receiver === myUsername) || (m.sender === myUsername && m.receiver === target));
                const lastMsg = chatMsgs.length > 0 ? chatMsgs[chatMsgs.length - 1] : null;
                
                let preview = "Toca para chatear";
                let timeText = "";
                if (lastMsg) {
                    if (lastMsg.deleted) preview = "🚫 Mensaje eliminado";
                    else if (lastMsg.type === 'image') preview = '📷 Imagen';
                    else if (lastMsg.type === 'audio') preview = '🎤 Nota de voz';
                    else preview = lastMsg.text;
                    
                    if (preview.length > 20) preview = preview.substring(0, 20) + '...';
                    if (lastMsg.sender === myUsername) preview = "Tú: " + preview;
                    timeText = lastMsg.time;
                }
                
                if (typingStatus[target]) preview = <span class="text-green-400 italic">escribiendo...</span>;
                
                const unread = unreadCounts[target] || 0;
                const activeClass = activeChat === target ? 'active-tab' : '';
                const isOnline = onlineUsers.includes(target) ? '<div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-zinc-900"></div>' : '';

                html += `<div onclick="openChat('${target}')" class="chat-tab p-4 border-b border-zinc-800 flex items-center justify-between ${activeClass}">
                            <div class="flex items-center gap-3 overflow-hidden w-3/4">
                                <div class="relative flex-shrink-0">
                                    <img src="${getContactPic(target)}" class="w-12 h-12 rounded-full object-cover bg-zinc-800" />
                                    ${isOnline}
                                </div>
                                <div class="truncate w-full">
                                    <span class="font-bold text-zinc-100 block truncate">${target}</span>
                                    <span class="text-sm text-zinc-400 block truncate">${preview}</span>
                                </div>
                            </div>
                            <div class="flex flex-col items-end flex-shrink-0">
                                <span class="text-xs text-zinc-600 mb-1">${timeText}</span>
                                ${unread > 0 ? <div class="bg-green-500 text-black text-xs font-bold w-5 h-5 flex items-center justify-center rounded-full">${unread}</div> : ""}
                            </div>
                        </div>`;
            });
            list.innerHTML = html;
        }

        // --- ABRIR UN CHAT ---
        function openChat(targetUser) {
            activeChat = targetUser;
            unreadCounts[targetUser] = 0; 
            
            document.getElementById('empty-chat').classList.add('hidden');
            document.getElementById('active-chat-header').classList.remove('hidden');
            document.getElementById('form').classList.remove('hidden');
            
            document.getElementById('chat-title').textContent = targetUser;
            document.getElementById('active-pic').src = getContactPic(targetUser);
            document.getElementById('chat-status').textContent = onlineUsers.includes(targetUser) ? 'en línea' : 'desconectado';
            
            socket.emit('mark_read', targetUser); // Avisar que leí sus mensajes
            
            renderMessages();
            renderUserList(); 
        }

        // --- RENDERIZAR MENSAJES Y PALOMITAS ---
        function renderMessages() {
            if(!activeChat) return;
            const box = document.getElementById('messages');
            box.innerHTML = '';
            
            const chatMsgs = allMessages.filter(m => (m.sender === activeChat && m.receiver === myUsername) || (m.sender === myUsername && m.receiver === activeChat));

            chatMsgs.forEach(msg => {
                const isMe = msg.sender === myUsername;
                const div = document.createElement('div');
                div.className = "flex flex-col " + (isMe ? "items-end" : "items-start");
                
                let contentHTML = "";
                
                if (msg.deleted) {
                    contentHTML = <span class="msg-deleted">🚫 Este mensaje fue eliminado</span>;
                } else {
                    if (msg.type === 'image') contentHTML = <img src="${msg.text}" class="rounded-xl max-w-[250px] shadow-sm">;
                    else if (msg.type === 'audio') contentHTML = <audio controls src="${msg.text}" class="h-10 w-64"></audio>;
                    else contentHTML = <p class="text-md leading-relaxed whitespace-pre-wrap">${msg.text}</p>;
                }

                // Palomitas
                let ticks = "";
                if (isMe && !msg.deleted) {
                    ticks = msg.status === 'read' ? <span class="text-blue-400 text-xs tracking-tighter">✓✓</span> : <span class="text-zinc-400 text-xs tracking-tighter">✓✓</span>;
                }

                // Botón Borrar
                let deleteBtn = (isMe && !msg.deleted) ? <button onclick="deleteMessage('${msg._id}')" class="text-xs text-red-400 hover:text-red-300 ml-3 opacity-0 group-hover:opacity-100 transition-opacity">Borrar</button> : '';

                div.innerHTML = `
                    <div class="group relative max-w-md">
                        <div class="p-3 rounded-2xl shadow-md ${isMe ? "bg-[#005c4b] text-white rounded-tr-none" : "bg-zinc-800 text-white rounded-tl-none"}">
                            ${contentHTML}
                            <div class="flex items-center justify-end gap-1 mt-1">
                                <span class="text-[10px] text-zinc-300 opacity-75">${msg.time}</span>
                                ${ticks}
                            </div>
                        </div>
                        <div class="absolute top-0 ${isMe ? "right-full mr-2" : "left-full ml-2"} h-full flex items-center">
                            ${deleteBtn}
                        </div>
                    </div>`;
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        }

        // --- PALOMITAS EN VIVO ---
        socket.on('messages_read', (readerName) => {
            allMessages.forEach(m => { if (m.sender === myUsername && m.receiver === readerName) m.status = 'read'; });
            if (activeChat === readerName) renderMessages();
        });

        // --- BORRAR EN VIVO ---
        function deleteMessage(id) {
            if(confirm("¿Eliminar para todos?")) socket.emit('delete_message', id);
        }
        socket.on('message_deleted', (id) => {
            const msg = allMessages.find(m => m._id === id);
            if(msg) { msg.deleted = true; renderMessages(); renderUserList(); }
        });

        // --- RECIBIR MENSAJES ---
        socket.on('chat message', (msg) => {
            allMessages.push(msg);
            if (msg.sender !== myUsername) {
                if (activeChat !== msg.sender) {
                    unreadCounts[msg.sender] = (unreadCounts[msg.sender] || 0) + 1; 
                    document.getElementById('notif-sound').play().catch(()=>{});
                } else {
                    socket.emit('mark_read', msg.sender); // Si tengo el chat abierto, marcar como leído automático
                }
            }
            if (typingStatus[msg.sender]) typingStatus[msg.sender] = false;
            renderMessages();
            renderUserList(); 
        });

        // --- ENTRADA DE TEXTO Y MICRÓFONO ---
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const micBtn = document.getElementById('mic-btn');

        input.addEventListener('input', () => {
            if(input.value.trim().length > 0) {
                sendBtn.classList.remove('hidden'); micBtn.classList.add('hidden');
                socket.emit('typing', { isTyping: true, receiver: activeChat });
            } else {
                sendBtn.classList.add('hidden'); micBtn.classList.remove('hidden');
                socket.emit('typing', { isTyping: false, receiver: activeChat });
            }
        });

        document.getElementById('form').addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value.trim()) {
                socket.emit('chat message', { text: input.value, type: 'text', receiver: activeChat });
                input.value = '';
                sendBtn.classList.add('hidden'); micBtn.classList.remove('hidden');
                socket.emit('typing', { isTyping: false, receiver: activeChat });
            }
        });

        // --- AUDIO (NOTAS DE VOZ) ---
        async function toggleAudio() {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => socket.emit('chat message', { text: reader.result, type: 'audio', receiver: activeChat });
                        audioChunks = [];
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    micBtn.classList.add('recording');
                    input.placeholder = "Grabando... (Toca para enviar)";
                    input.disabled = true;
                } catch(err) { alert("Necesitas dar permisos de micrófono."); }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                micBtn.classList.remove('recording');
                input.placeholder = "Mensaje...";
                input.disabled = false;
            }
        }

        // --- IMÁGENES ---
        document.getElementById('image-upload').addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => socket.emit('chat message', { text: e.target.result, type: 'image', receiver: activeChat });
                reader.readAsDataURL(file);
                this.value = '';
            }
        });

        // --- EMOJIS ---
        function toggleEmojis() { document.getElementById('emoji-picker').classList.toggle('hidden'); }
        function addEmoji(e) { 
            input.value += e; 
            toggleEmojis(); 
            sendBtn.classList.remove('hidden'); micBtn.classList.add('hidden'); // Mostrar botón de enviar
        }

        // --- ESCRIBIENDO ---
        socket.on('typing', (data) => {
            typingStatus[data.user] = data.isTyping;
            if(activeChat === data.user) document.getElementById('chat-status').textContent = data.isTyping ? 'escribiendo...' : 'en línea';
            renderUserList();
        });
    </script>
</body>
</html>
